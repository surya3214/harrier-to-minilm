[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harrier-distill"
version = "0.1.0"
description = "Air-gap EN/KO distillation from Harrier embeddings into mMiniLMv2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.45.0",
  "sentence-transformers>=3.0.0",
  "datasets>=2.19.0",
  "huggingface_hub>=0.24.0",
  "accelerate>=0.33.0",
  "pyarrow>=15.0.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "pyyaml>=6.0",
  "tqdm>=4.66.0",
  "safetensors>=0.4.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]